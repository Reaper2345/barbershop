<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-labelledby="svc-complex">
  <title id="svc-complex">Комплексные услуги</title>
  <rect width="240" height="240" fill="#141414"/>
  <circle cx="120" cy="120" r="96" fill="none" stroke="#c9a961" stroke-width="1.5" opacity="0.22"/>
  <!-- Overlapping rings: several services in one visit -->
  <g fill="none" stroke="#c9a961" stroke-width="2.5" opacity="0.75">
    <circle cx="96" cy="108" r="42"/>
    <circle cx="146" cy="108" r="42"/>
    <circle cx="121" cy="150" r="42"/>
  </g>
  <circle cx="121" cy="120" r="7" fill="#c9a961" opacity="0.85"/>
</svg>
